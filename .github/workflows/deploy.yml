name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: Type-check and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run generate

      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e

            cd /opt/db-platform

            echo "Pull latest code"
            git pull --ff-only origin main

            echo "Build backend without BuildKit"
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose --env-file .env -f docker-compose.prod.yml build backend

            echo "Build notification worker without BuildKit"
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose --env-file .env -f docker-compose.prod.yml build notification-worker

            echo "Build frontend without BuildKit"
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose --env-file .env -f docker-compose.prod.yml build frontend

            echo "Run Prisma migrations"
            docker compose --env-file .env -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy

            echo "Start containers"
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            echo "Cleanup unused Docker images"
            docker image prune -f

            echo "Health check"
            curl -f https://db-platform.ru
