name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: Type-check, lint and test
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db_platform_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: db_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend unit
        working-directory: frontend
        run: npm run test:unit

      - name: Test frontend integration
        working-directory: frontend
        run: npm run test:integration

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run generate

      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend unit
        working-directory: backend
        run: npm test

      - name: Run backend test migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Test backend integration
        working-directory: backend
        run: npm run test:integration
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -e

            cd /opt/db-platform

            echo "Pull latest code"
            git pull --ff-only origin main

            echo "Build backend without BuildKit"
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose --env-file .env -f docker-compose.prod.yml build backend

            echo "Build notification worker without BuildKit"
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose --env-file .env -f docker-compose.prod.yml build notification-worker

            echo "Build frontend without BuildKit"
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose --env-file .env -f docker-compose.prod.yml build frontend

            echo "Run Prisma migrations"
            docker compose --env-file .env -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy

            echo "Start containers"
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            echo "Cleanup unused Docker images"
            docker image prune -f

            echo "Health check"
            curl -f https://db-platform.ru
