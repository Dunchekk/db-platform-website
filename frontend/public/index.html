<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="db: авторские объекты для повседневного использования. Каталог, карточки товаров, доставка и оформление заказа онлайн."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://db-platform.ru/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="db-platform" />
    <meta property="og:title" content="Платформа db" />
    <meta
      property="og:description"
      content="Объекты от DB. Каталог, доставка и оформление заказа онлайн."
    />
    <meta
      name="keywords"
      content="db, дб, интернет магазин дб, интернет магазин db, иван дубовицкий, дубовицкий, db-platform"
    />
    <meta property="og:url" content="https://db-platform.ru/" />
    <base href="/" />
    <script>
      (function () {
        try {
          var baseEl = document.querySelector("base");
          if (!baseEl) return;

          var hostname = window.location.hostname;
          var isGithubIo = /(^|\.)github\.io$/i.test(hostname);
          if (!isGithubIo) {
            baseEl.setAttribute("href", "/");
            return;
          }

          var segments = window.location.pathname.split("/").filter(Boolean);
          var repo = segments.length > 0 ? segments[0] : "";
          var href = repo ? "/" + repo + "/" : "/";
          baseEl.setAttribute("href", href);
        } catch (e) {
          // no-op
        }
      })();
    </script>
    <title>db</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get("redirect");
          if (!redirect) return;

          params.delete("redirect");

          var base = window.location.pathname.replace(/\/$/, "");
          var nextUrl = base + decodeURIComponent(redirect);
          var restSearch = params.toString();
          if (restSearch) nextUrl += "?" + restSearch;

          window.history.replaceState(null, "", nextUrl);
        } catch (e) {
          // no-op
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var el = document.getElementById("boot-loader");
          if (!el) return;

          var reduceMotionQuery =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)");

          if (reduceMotionQuery && reduceMotionQuery.matches) {
            el.classList.add("is-visible");
            return;
          }

          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              if (el.dataset.state === "hidden") return;
              el.classList.add("is-visible");
            });
          });
        } catch (e) {
          // no-op
        }
      })();
    </script>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 1000ms ease;
        pointer-events: all;
        z-index: 9999;
      }

      #boot-loader.is-visible {
        opacity: 1;
      }

      #boot-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-loader .bootLoader {
        width: 66px;
        height: 66px;
        position: relative;
      }

      #boot-loader .bootLoaderDot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #000;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #boot-loader .bootLoaderOrbit {
        position: absolute;
        inset: 0;
        animation: bootLoaderSpin 900ms linear infinite;
      }

      #boot-loader .bootLoaderOrbitDot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #000;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) translateX(18px);
      }

      @keyframes bootLoaderSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-label="Loading" role="status">
      <div class="bootLoader" aria-hidden="true">
        <div class="bootLoaderDot"></div>
        <div class="bootLoaderOrbit">
          <div class="bootLoaderOrbitDot"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
